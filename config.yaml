server:
  host: "0.0.0.0"
  port: 8080
  refresh_interval: 1    # seconds

sensors:
  method: "auto"         # auto | ipmitool | sd5 | wmi | disabled
  ipmitool_path: "ipmitool"

gpu:
  enabled: true

services:
  - name: "ddns-go"
    display: "DDNS-GO 域名解析"
  - name: "sshd"
    display: "OpenSSH SSH Server"
  - name: "sd5"
    display: "SuperDoctor 5 Service"

commands:
  - name: "学在浙大自动签到"
    cmd: "powershell -Command \"Get-Content \"$env:USERPROFILE\\.pm2\\logs\\zju-autosign-out.log\" -Tail 10\""
    interval: 60
  - name: "boot-time"
    cmd: "systeminfo | findstr /B /C:\"System Boot Time\""
    interval: 60
  - name: "disk-free"
    cmd: "wmic logicaldisk get caption,freespace,size"
    interval: 30
  - name: "top-processes"
    cmd: "powershell -Command \"Get-Process | Sort-Object CPU -Descending | Select-Object -First 10 Name, CPU, WorkingSet64 | Format-Table -AutoSize | Out-String\""
    interval: 10
  - name: "net-adapters"
    cmd: "powershell -Command \"Get-NetAdapter | Select-Object Name, Status, LinkSpeed | Format-Table -AutoSize | Out-String\""
    interval: 30
  - name: "recent-events"
    cmd: "powershell -Command \"Get-EventLog -LogName System -Newest 5 -EntryType Error,Warning 2>$null | Select-Object TimeGenerated, EntryType, Message | Format-List | Out-String\""
    interval: 60
